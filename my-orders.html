<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Orders</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
</head>
<body style="font-family:sans-serif;max-width:600px;margin:30px auto;">
  <h2>My Orders</h2>
  <div id="orders"></div>

  <script>
    const API_BASE_URL = "https://quickbyte-com-food-ordering-website.onrender.com";
    let accessToken = null;

    async function loadOrders() {
      const res = await fetch(`${API_BASE_URL}/orders/mine`, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) { document.getElementById('orders').textContent = 'Failed to load orders.'; return; }
      const { orders } = await res.json();

      document.getElementById('orders').innerHTML = orders.map(o => `
        <div style="border:1px solid #ddd;border-radius:6px;padding:12px;margin-bottom:10px;">
          <strong>Order #${o.order_number}</strong> — ${o.status}
          ${o.box_number ? ` — Box ${o.box_number}` : ''}
          <div style="font-size:12px;color:#888;">${new Date(o.created_at).toLocaleString()} (v${o.version})</div>
          <div style="font-size:13px;">${o.source_filename || ''}</div>
          <button data-id="${o.id}" style="margin-top:6px;">Download my file</button>
        </div>
      `).join('') || '<p>No orders yet.</p>';

      document.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const res = await fetch(`${API_BASE_URL}/orders/mine/${btn.dataset.id}/download`, {
            headers: { Authorization: `Bearer ${accessToken}` },
          });
          if (!res.ok) { alert('Could not get download link.'); return; }
          const { url } = await res.json();
          window.open(url, '_blank');
        });
      });
    }

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { document.body.innerHTML = '<p>Please sign in first.</p>'; return; }
      accessToken = session.access_token;
      loadOrders();
    })();
  </script>
</body>
</html>
