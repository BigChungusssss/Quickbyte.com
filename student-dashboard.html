<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Orders & Notifications</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="role-guard.js"></script>
  <style>
    body{ font-family:sans-serif; max-width:600px; margin:30px auto; padding:0 16px; }
    .section{ border:1px solid #ddd; border-radius:6px; padding:16px; margin-bottom:24px; background:#fafafa; }
    .order, .notification{ border:1px solid #ddd; border-radius:6px; padding:12px; margin-bottom:10px; background:#fff; }
    .notification.unread { border-left: 4px solid #007bff; background: #f0f7ff; }
    .toast{
      position:fixed; top:16px; right:16px; background:#1C2420; color:#F5F2E6;
      padding:12px 18px; border-radius:6px; font-size:14px; max-width:320px;
      box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:999;
      animation: toast-in .2s ease-out;
    }
    @keyframes toast-in{ from{ opacity:0; transform:translateY(-8px);} to{ opacity:1; transform:translateY(0);} }
  </style>
</head>
<body>
  <h2>My Dashboard</h2>

  <!-- Notifications Section -->
  <div class="section">
    <h3>Notifications</h3>
    <div id="notifications-list"><p style="font-size:13px;color:#666;">Loading notifications...</p></div>
  </div>

  <!-- Orders Section -->
  <h3>My Orders</h3>
  <div id="orders"></div>

  <script>
    let accessToken = null;

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 6000);
    }

    async function loadNotifications() {
      const res = await fetch(`${API_BASE_URL}/notifications/mine`, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) return;
      const { notifications } = await res.json();

      const container = document.getElementById('notifications-list');
      if (!notifications || notifications.length === 0) {
        container.innerHTML = '<p style="font-size:13px;color:#666;">No notifications yet.</p>';
        return;
      }

      container.innerHTML = notifications.map(n => `
        <div class="notification ${n.is_read ? '' : 'unread'}">
          <div style="font-size:14px;">${n.message}</div>
          <div style="font-size:11px;color:#888;margin-top:4px;">${new Date(n.created_at).toLocaleString()}</div>
          ${!n.is_read ? `<button data-action="mark-read" data-id="${n.id}" style="margin-top:6px;font-size:11px;">Mark as Read</button>` : ''}
        </div>
      `).join('');

      document.querySelectorAll('[data-action="mark-read"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch(`${API_BASE_URL}/notifications/${btn.dataset.id}/read`, {
            method: 'PATCH',
            headers: { Authorization: `Bearer ${accessToken}` },
          });
          loadNotifications();
        });
      });
    }

    async function loadOrders() {
      const res = await fetch(`${API_BASE_URL}/orders/mine`, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!res.ok) return;
      const { orders } = await res.json();

      document.getElementById('orders').innerHTML = orders.map(o => `
        <div class="order">
          <strong>Order #${o.order_number}</strong> — <strong>Status:</strong> ${o.status.replace('_', ' ')}
          ${o.box_number ? ` — 📦 Box ${o.box_number}` : ''}
          <div style="font-size:12px;color:#888;margin:4px 0;">${new Date(o.created_at).toLocaleString()} (v${o.version})</div>
          
          ${o.items ? `
            <ul style="margin:8px 0;padding-left:18px;font-size:13px;">
              ${o.items.map(it => `<li>${it.name}${it.variantLabel ? ` (${it.variantLabel})` : ''} × ${it.qty}</li>`).join('')}
            </ul>
          ` : ''}
        </div>
      `).join('') || '<p>No orders yet.</p>';
    }

    (async () => {
      accessToken = await requireRole(['student']);
      if (!accessToken) return;

      await loadOrders();
      await loadNotifications();

      const { data: { user } } = await supabaseClient.auth.getUser();
      supabaseClient
        .channel('my-notifications')
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'notifications', filter: `student_id=eq.${user.id}` },
          (payload) => {
            showToast(payload.new.message);
            loadNotifications(); 
            loadOrders(); 
          }
        )
        .subscribe();
    })();
  </script>
</body>
</html>
