<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supplier Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="role-guard.js"></script>
</head>
<body style="font-family:sans-serif;max-width:900px;margin:30px auto;">
  <h2>Supplier Dashboard</h2>
  <div id="orders"></div>
 
  <script>
    let accessToken = null;
 
    function authHeaders() {
      return { Authorization: `Bearer ${accessToken}` };
    }
 
    async function fetchOrders() {
      const res = await fetch(`${API_BASE_URL}/supplier/orders`, { headers: authHeaders() });
      if (!res.ok) return;
      const { orders } = await res.json();
      renderOrders(orders);
    }
 
    function groupByLeader(orders) {
      const groups = {};
      orders.forEach(o => {
        const leaderName = o.class_leaders?.name || 'Unassigned';
        if (!groups[leaderName]) groups[leaderName] = [];
        groups[leaderName].push(o);
      });
      return groups;
    }
 
    function renderOrders(orders) {
      const groups = groupByLeader(orders);
 
      document.getElementById('orders').innerHTML = Object.entries(groups).map(([leaderName, group]) => `
        <h3 style="margin-top:24px;border-bottom:1px solid #ccc;padding-bottom:4px;">${leaderName}</h3>
        ${group.map(o => `
          <div style="border:1px solid #ddd;border-radius:6px;padding:12px;margin-bottom:10px;background:#fff;">
            <strong>Order #${o.order_number}</strong> — <strong>Status:</strong> ${o.status.replace('_', ' ')}
            ${o.box_number ? ` — 📦 Box ${o.box_number}` : ''}
            <span style="color:#888;font-size:12px;"> (v${o.version}, ${new Date(o.created_at).toLocaleString()})</span>
            
            <!-- Fixed from cart_items to items -->
            ${o.items && Array.isArray(o.items) ? `
              <ul style="margin:8px 0;padding-left:18px;font-size:13px;">
                ${o.items.map(it => `<li><strong>${it.name}</strong>${it.variantLabel ? ` (${it.variantLabel})` : ''} × ${it.qty}</li>`).join('')}
              </ul>
            ` : `<div style="font-size:13px;color:#666;margin-top:6px;">No items listed</div>`}

            <div style="margin-top:12px;display:flex;gap:8px;">
              ${o.file_storage_path ? `<button data-action="download" data-id="${o.id}">Download file</button>` : ''}
              ${o.status !== 'ready' && o.status !== 'picked_up'
                ? `<button data-action="ready" data-id="${o.id}">Mark ready</button>`
                : ''}
              ${o.status === 'ready'
                ? `<button data-action="picked-up" data-id="${o.id}">Mark picked up</button>`
                : ''}
            </div>
          </div>
        `).join('')}
      `).join('') || '<p>No orders found.</p>';
 
      document.querySelectorAll('[data-action="download"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const res = await fetch(`${API_BASE_URL}/supplier/orders/${btn.dataset.id}/download`, { headers: authHeaders() });
          if (!res.ok) { alert('Could not get download link.'); return; }
          const { url } = await res.json();
          window.open(url, '_blank');
        });
      });
 
      document.querySelectorAll('[data-action="ready"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch(`${API_BASE_URL}/supplier/orders/${btn.dataset.id}/ready`, {
            method: 'PATCH', headers: authHeaders(),
          });
          fetchOrders();
        });
      });
 
      document.querySelectorAll('[data-action="picked-up"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          await fetch(`${API_BASE_URL}/supplier/orders/${btn.dataset.id}/picked-up`, {
            method: 'POST', headers: authHeaders(),
          });
          fetchOrders();
        });
      });
    }
 
    (async () => {
      accessToken = await requireRole(['supplier', 'admin']);
      if (!accessToken) return;
 
      await fetchOrders();
 
      supabaseClient
        .channel('supplier-orders')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (payload) => {
          if (payload.eventType === 'INSERT') {
            showToast(`New order #${payload.new.order_number}`);
          }
          fetchOrders();
        })
        .subscribe();
    })();
 
    function showToast(message) {
      const toast = document.createElement('div');
      toast.textContent = message;
      toast.style.cssText = 'position:fixed;top:16px;right:16px;background:#1C2420;color:#F5F2E6;padding:12px 18px;border-radius:6px;font-size:14px;max-width:320px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:999;';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 6000);
    }
  </script>
</body>
</html>
